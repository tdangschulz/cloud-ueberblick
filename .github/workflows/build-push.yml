name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'

# Wichtig: GITHUB_TOKEN braucht Schreibrechte für die Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten (sauberer, frischer Builder)
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry einloggen
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen (Tag = Branch-Name)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/meine-pipeline-app:${{ github.ref_name }}
          # Attestations deaktivieren — häufigste Ursache für "unknown blob"
          # bei ghcr.io in Kombination mit neueren BuildKit-Versionen
          provenance: false
          sbom: false
